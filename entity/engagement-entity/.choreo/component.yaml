schemaVersion: 1.2

endpoints:
  - name: engagement-entity-api
    displayName: Engagement Entity API
    service:
      basePath: /
      port: 8290
    type: REST

    # Project and Organization: the Engagement App Backend (same Choreo
    # project) is the main caller; Organization makes the endpoint reachable
    # from other projects in the organization. Never Public: the service has
    # no auth middleware of its own.
    networkVisibilities:
      - Project
      - Organization
    schemaFilePath: openapi.yaml
