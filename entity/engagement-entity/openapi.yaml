openapi: 3.0.3
info:
  title: Engagement Entity Service
  description: |-
    Internal entity service for the Engagement App (Release 1). It is the only component that reads and writes the legacy Allocations (allocation_db) and Travel (travelapp) databases, reads expense_app (card spend, read-only), and talks to NetSuite. Its one caller is the Engagement App Backend: the component is visible to its Choreo project only and applies no auth of its own. The backend verifies the user's token and enforces the legacy privileges before calling here, and passes the acting user's email in request bodies (createdBy / updatedBy) where a write needs it.

    Audit: the backend sends the signed-in user in X-User-Email and its request id in X-Correlation-ID on every call. Every write records audit_event rows (allocation_db or travelapp, the schema of the change) in its own transaction, with that user and request id; views, downloads and exports are recorded through POST /audit-events.

    No authentication: the component is visible to its Choreo project only (security: []).
  version: 0.2.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:8290
  description: Local development
security: []
tags:
- name: Health
- name: Access
  description: Roles, privileges and role-privilege mappings of each legacy app.
- name: Lookups
- name: Engagements
- name: Reference Data
- name: Settings
- name: Finance
- name: Audit
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness check
      operationId: healthCheck
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /access/{app}/roles:
    get:
      tags:
      - Access
      summary: List an app's roles
      description: Every row of the app's roles table. A role name is an Asgardeo group name; there is
        no user-to-role table.
      operationId: listRoles
      parameters:
      - $ref: '#/components/parameters/App'
      responses:
        '200':
          description: Roles, ordered by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRolesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /access/{app}/privileges:
    get:
      tags:
      - Access
      summary: List an app's active privileges
      description: Rows of the app's privileges table with status 'active', as the legacy Role Settings
        screen lists them.
      operationId: listPrivileges
      parameters:
      - $ref: '#/components/parameters/App'
      responses:
        '200':
          description: Active privileges, ordered by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPrivilegesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /access/{app}/role-privileges:
    get:
      tags:
      - Access
      summary: Get an app's full role-to-privilege mapping
      description: Every role name with the privilege ids it grants. The backend caches this and resolves
        a caller's groups locally; the result for a set of groups is exactly what the legacy backend's
        "privileges for these roles" query returns (Allocations joins role_privilege to roles; Travel
        also requires the privilege row to exist; neither filters on privilege status). Privilege ids
        are only meaningful within their app.
      operationId: getRolePrivilegeMap
      parameters:
      - $ref: '#/components/parameters/App'
      responses:
        '200':
          description: Role-privilege mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePrivilegeMapResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /access/travel/agency:
    get:
      tags:
      - Access
      summary: The travel agency a person works for
      description: Legacy getTravelAgentIdByEmailQuery (travel_agent_employee, status Active) joined to
        the agency name. Agents see only their agency's travel requests and invoices. `agency` is null
        when the person is not an active travel agent employee.
      operationId: getTravelAgency
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The agency, or null
          content:
            application/json:
              schema:
                type: object
                required:
                - agency
                properties:
                  agency:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /engagement-types:
    get:
      tags:
      - Lookups
      summary: List engagement types
      description: Port of the legacy getEngagementTypeQuery, ordered by id.
      operationId: listEngagementTypes
      parameters:
      - name: type
        in: query
        required: false
        description: Internal or Customer (case-insensitive). Omitted, both.
        schema:
          type: string
          enum:
          - Internal
          - Customer
      - name: isActive
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Engagement types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEngagementTypesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /allocation-types:
    get:
      tags:
      - Lookups
      summary: List allocation types
      description: 'Port of the legacy getAllocationTypesQuery: only Active and Deleted rows, joined to
        their engagement type, ordered by name. status values are returned as stored (both "ACTIVE" and
        "Active" occur).'
      operationId: listAllocationTypes
      parameters:
      - name: engagementTypeId
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: status
        in: query
        required: false
        description: Active or Deleted (case-insensitive). Omitted, both.
        schema:
          type: string
          enum:
          - Active
          - Deleted
      responses:
        '200':
          description: Allocation types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllocationTypesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /reference-data:
    get:
      tags:
      - Reference Data
      summary: Every lookup list of allocation_db and travelapp
      description: Engagement types (all), allocation types (Active and Deleted), business units, product
        units (with their business unit), regions, sub regions (with their region), travel agencies (all,
        with the NetSuite vendor id), active invoice cost types and Active per diem rates (a non-numeric
        amount is left out).
      operationId: getReferenceData
      responses:
        '200':
          description: The lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceDataResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /audit-events:
    post:
      tags:
      - Audit
      summary: Record a view, download or export
      description: Written to the schema of entityType (allocation_db for engagement, allocation and allocation_type;
        travelapp for the rest). Writes record their own events, so only View, Download and Export are accepted.
        Append-only; there is no read API.
      operationId: recordAuditEvent
      parameters:
      - name: X-User-Email
        in: header
        description: The signed-in user; without it the event is recorded as system.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditReadEvent'
      responses:
        '204':
          description: Recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /engagements/search:
    post:
      tags:
      - Engagements
      summary: Search engagements (legacy getEngagements / getEngagementsForApprovalProcess)
      description: 'pendingApproval false lists every engagement that is not Pending Approval; true lists
        only those. Multi-value filters are OR within, AND across. search matches id, account, title,
        code, country and allocation type (and the creator for pendingApproval). Sort `current` (default):
        rows ending on or after `today` first by start ascending, then the rest by start descending; `created`:
        oldest first. typeCounts counts the base set per engagement type.'
      operationId: searchEngagements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngagementSearchRequest'
      responses:
        '200':
          description: A page of engagements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /engagements/facets:
    get:
      tags:
      - Engagements
      summary: Distinct accounts, allocation types and countries of engagements (not Pending Approval)
        of the types
      operationId: getEngagementFacets
      parameters:
      - name: engagementTypeId
        in: query
        schema:
          type: array
          items:
            type: integer
      responses:
        '200':
          description: Distinct values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementFacetsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /engagements:
    post:
      tags:
      - Engagements
      summary: Create an engagement (legacy addEngagement)
      description: 'The id comes from a database trigger; the row is re-read by uuid. Funding sources
        are resolved by name (unknown names insert nothing, as legacy). For a Marketing Event the NetSuite
        marketing event is created inside the transaction (a failure rolls back: 503; an event name
        NetSuite already has: 409) once a NetSuite client is wired; until then it is skipped with a
        warning.'
      operationId: createEngagement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngagementCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engagement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /engagements/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9]+$
    get:
      tags:
      - Engagements
      summary: One engagement with its funding sources
      operationId: getEngagement
      responses:
        '200':
          description: The engagement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engagement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Engagements
      summary: Update an engagement (legacy updateEngagement), with the cancel cascade
      description: Only the fields sent are written; funding sources are replaced when a non-empty list
        is sent. engagementStatus Cancelled also sets every allocation of the engagement to Allocation
        Cancelled / Inactive and, in travelapp, cancels the travel requests of the Active allocations
        that were Confirmed or Confirmed - Visa Pending with travel required (status Cancelled, last_updated_by,
        last_updated_date). Those allocations, read before the cascade, are returned for the email.
      operationId: updateEngagement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngagementUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /engagements/{id}/roster:
    get:
      tags:
      - Engagements
      summary: The engagement's allocations with their travel requests
      operationId: getEngagementRoster
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: activeOnly
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Allocations by id
          content:
            application/json:
              schema:
                type: object
                required:
                - allocations
                properties:
                  allocations:
                    type: array
                    items:
                      $ref: '#/components/schemas/EngagementAllocation'
        '400':
          $ref: '#/components/responses/BadRequest'
  /role-settings/{app}:
    get:
      tags:
      - Settings
      summary: Roles of one legacy app with their privilege ids, and its active privileges
      operationId: getRoleSettings
      parameters:
      - name: app
        in: path
        required: true
        schema:
          type: string
          enum:
          - allocations
          - travel
      responses:
        '200':
          description: Roles and privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleSettingsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /role-settings/{app}/roles/{roleId}/privileges:
    put:
      tags:
      - Settings
      summary: Replace a role's privileges, with the legacy privilege audit
      description: 'Allocations: delete + insert in a transaction, then an audit_log row (ROLE / UPDATE,
        legacy description). Travel: delete, insert and a privilege_auditlog row in one transaction. Ids
        must be active privileges of the app.'
      operationId: replaceRolePrivileges
      parameters:
      - name: app
        in: path
        required: true
        schema:
          type: string
          enum:
          - allocations
          - travel
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - privilegeIds
              - updatedBy
              properties:
                privilegeIds:
                  type: array
                  items:
                    type: integer
                updatedBy:
                  type: string
      responses:
        '200':
          description: The role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleWithPrivileges'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /settings/allocation-types:
    post:
      tags:
      - Settings
      summary: Add an allocation type (status ACTIVE, department upper case, audit row)
      operationId: createAllocationType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsAllocationTypeInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementAllocationType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /settings/allocation-types/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    put:
      tags:
      - Settings
      summary: Update an allocation type (audit row)
      operationId: updateAllocationType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsAllocationTypeInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementAllocationType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Settings
      summary: Soft-delete an allocation type (status Deleted, audit row, no in-use check)
      operationId: deleteAllocationType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorRequest'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /allocations/engagements/{id}:
    get:
      tags:
      - Allocations
      summary: The engagement an allocation is made on (legacy getEngagement, with funding sources)
      operationId: getAllocationEngagement
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The engagement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationEngagement'
        '404':
          $ref: '#/components/responses/Error'
  /allocations/{id}:
    get:
      tags:
      - Allocations
      summary: One allocation in any status, with its engagement when it has one
      operationId: getAllocation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The allocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationRecord'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Allocations
      summary: Update an allocation (legacy updateAllocation) and create or cancel its travel row
      description: 'Only the fields sent change (updated_by always). For an engagement allocation of an
        employee with travel required and a new clearance status: Confirmed - Visa Pending, or Confirmed
        when the previous status was not Confirmed - Visa Pending, inserts a travelapp.travel row (status
        New, Pre-Approved, added by the allocation''s added_by); another valid status after Confirmed
        / Confirmed - Visa Pending cancels its travel rows. The travel write happens before the allocation_db
        commit, so a travel failure rolls the update back.'
      operationId: updateAllocation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationUpdateResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Allocations
      summary: Set the allocation's status to Deleted (legacy deleteAllocation; no travel cancel)
      operationId: deleteAllocation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
  /allocations/timeline:
    post:
      tags:
      - Allocations
      summary: Active allocations of people touching a window (legacy getAllocationsByEmail, without the
        employee join)
      operationId: allocationTimeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationTimelineRequest'
      responses:
        '200':
          description: Allocations by start date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationList'
        '400':
          $ref: '#/components/responses/Error'
  /allocations/search:
    post:
      tags:
      - Allocations
      summary: Engagement Allocations list page and total (legacy getEngagementAllocations, Active only)
      operationId: searchAllocations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationSearchRequest'
      responses:
        '200':
          description: A page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationSearchResponse'
        '400':
          $ref: '#/components/responses/Error'
  /allocations/bulk:
    post:
      tags:
      - Allocations
      summary: Insert and update allocations in one transaction (legacy bulkUploadAllocations)
      description: Refuses (409) an identical active engagement allocation (same email, engagement and
        dates; LEGACY-ISSUES L5). Inserts newAllocations in order and returns the id the trigger gave
        the first; inserts the travel row of the first engagement allocation with travel required, Confirmed
        / Confirmed - Visa Pending and not a partner; applies updateAllocations; writes allocationLogs
        to allocation_upload_log; sets the engagement's request status to In Progress when asked.
      operationId: bulkAllocations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationBulkRequest'
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationBulkResponse'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /allocations/visas:
    get:
      tags:
      - Allocations
      summary: Visas valid over an allocation (travel readiness of the Confirmed email; every country,
        first 100)
      operationId: allocationVisas
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Visas
          content:
            application/json:
              schema:
                type: object
                properties:
                  visas:
                    type: array
                    items:
                      $ref: '#/components/schemas/AllocationVisa'
        '400':
          $ref: '#/components/responses/Error'
  /consultant-allocations:
    get:
      tags:
      - Allocations
      summary: Consultant Allocations report rows (legacy getConsultantAllocations, with funding sources)
      description: Reads allocation_db.employee (the HR copy, which also holds partners under business
        unit PARTNER).
      operationId: consultantAllocations
      parameters:
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - name: email
        in: query
        schema:
          type: string
      - name: allocationTypeId
        in: query
        schema:
          type: array
          items:
            type: integer
      - name: businessUnit
        in: query
        schema:
          type: string
      - name: department
        in: query
        schema:
          type: string
      - name: team
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Rows ordered by allocation id
          content:
            application/json:
              schema:
                type: object
                properties:
                  allocations:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsultantAllocation'
        '400':
          $ref: '#/components/responses/Error'
  /consultant-allocations/non-allocated:
    get:
      tags:
      - Allocations
      summary: Employees (not department PARTNER) with no active allocation in the window (legacy nonAllocatedEmployees)
      operationId: consultantNonAllocated
      parameters:
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - name: businessUnit
        in: query
        schema:
          type: string
      - name: department
        in: query
        schema:
          type: string
      - name: team
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Employees by email
          content:
            application/json:
              schema:
                type: object
                properties:
                  employees:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsultantNonAllocatedEmployee'
        '400':
          $ref: '#/components/responses/Error'
  /consultant-allocations/team-defaults:
    get:
      tags:
      - Allocations
      summary: Default allocation type and code per team (default_allocation_for_team)
      operationId: consultantTeamDefaults
      responses:
        '200':
          description: Defaults ordered by business unit, department, team
          content:
            application/json:
              schema:
                type: object
                properties:
                  defaults:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsultantTeamDefault'
  /consultant-allocations/engagement-codes:
    get:
      tags:
      - Allocations
      summary: Engagement code groups and GL codes (engcode_grouping_gl_codes), in table order
      operationId: consultantEngagementCodes
      responses:
        '200':
          description: Codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  codes:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsultantEngagementCode'
  /travel-requests/search:
    post:
      tags:
      - Travel
      summary: Search travel requests (legacy travel-search / agent-travel-search)
      description: Rows with status Deleted or NULL are never returned (legacy get_sorted_all_travel_requests
        view). Multi-value filters are OR within a filter and AND across filters. Default limit 100, at
        most 1000.
      operationId: searchTravelRequests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravelRequestSearch'
      responses:
        '200':
          description: A page
