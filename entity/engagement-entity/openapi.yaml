      summary: Payment queue sizes
      operationId: financePaymentCounts
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: integer
                  failed:
                    type: integer
                  all:
                    type: integer
  /finance/per-diem-payments/{perDiemNumber}:
    get:
      tags:
      - Finance
      summary: One payment by its per diem number
      operationId: financePayment
      parameters:
      - $ref: '#/components/parameters/PerDiemNumber'
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancePayment'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Finance
      summary: Edit a Pending payment's amount and conversion (409 when not Pending)
      operationId: financeUpdatePayment
      parameters:
      - $ref: '#/components/parameters/PerDiemNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - paymentAmount
              - convertedCurrency
              - convertedAmount
              - updatedBy
              properties:
                paymentAmount:
                  type: number
                convertedCurrency:
                  type: string
                convertedAmount:
                  type: number
                updatedBy:
                  type: string
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancePayment'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /finance/per-diem-payments/{perDiemNumber}/push:
    post:
      tags:
      - Finance
      summary: Push one Pending payment as a vendor bill (claim, lookup, push)
      operationId: financePushPayment
      parameters:
      - $ref: '#/components/parameters/PerDiemNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - updatedBy
              - employee
              properties:
                updatedBy:
                  type: string
                employee:
                  $ref: '#/components/schemas/FinanceEmployee'
      responses:
        '200':
          description: Outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancePushResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /finance/per-diem-payments/{perDiemNumber}/resync:
    post:
      tags:
      - Finance
      summary: Settle a Failed payment by a vendor bill lookup
      operationId: financeResyncPayment
      parameters:
      - $ref: '#/components/parameters/PerDiemNumber'
      requestBody:
        $ref: '#/components/requestBodies/Actor'
      responses:
        '200':
          description: Outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancePushResult'
        '503':
          $ref: '#/components/responses/Error'
  /finance/per-diem-payments/{perDiemNumber}/netsuite-reference:
    get:
      tags:
      - Finance
      summary: Live vendor bill lookup
      operationId: financePaymentReference
      parameters:
      - $ref: '#/components/parameters/PerDiemNumber'
      responses:
        '200':
          description: Reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceReference'
        '503':
          $ref: '#/components/responses/Error'
  /finance/subsidiaries/{company}:
    get:
      tags:
      - Finance
      summary: The active expense_app subsidiary whose code is the HR company name
      operationId: financeSubsidiary
      parameters:
      - name: company
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Subsidiary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceSubsidiary'
        '404':
          $ref: '#/components/responses/Error'
  /dashboard/allocations-today:
    get:
      tags:
      - Dashboard
      summary: The legacy Allocations dashboard queries (allocation_db), verbatim
      description: No date runs getAllocationsWithEngagementTypeQuery, getPaidAllocationsWithAllocationTypeQuery
        and getNonPaidAllocationsWithAllocationTypeQuery (curdate()); a date runs their getPast… variants.
        Plus count(DISTINCT allocation.email) under the same predicates.
      operationId: dashboardAllocationsToday
      parameters:
      - name: date
        in: query
        schema:
          type: string
          format: date
      - name: businessUnitId
        in: query
        description: engagement_funding_source.business_unit_id
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAllocationsToday'
        '400':
          $ref: '#/components/responses/DashboardBadRequest'
  /dashboard/my-work:
    get:
      tags:
      - Dashboard
      summary: A person's active engagement allocations ending today or later, today's team allocation
        and (trips) upcoming trips
      operationId: dashboardMyWork
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
      - name: today
        in: query
        schema:
          type: string
          format: date
      - name: trips
        in: query
        schema:
          type: boolean
      - name: tripLimit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
      responses:
        '200':
          description: Own work
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMyWork'
        '400':
          $ref: '#/components/responses/DashboardBadRequest'
  /dashboard/queues:
    get:
      tags:
      - Dashboard
      summary: Waiting on You counts (allocation_db and travelapp)
      description: Only the parts asked for run. Failed invoice push = Accepted by finance and updated_by
        set and not the finance approver; failed payment push = Pending and last_updated_by set (the legacy
        schema has no push column; travel-finance-port-spec 5.5).
      operationId: dashboardQueues
      parameters:
      - name: pendingApprovalType
        in: query
        description: Engagement types (1, 5).
        schema:
          type: array
          items:
            type: integer
      - name: clearanceType
        in: query
        description: Engagement types for the clearance counts.
        schema:
          type: array
          items:
            type: integer
      - name: travelRequests
        in: query
        schema:
          type: boolean
      - name: invoices
        in: query
        schema:
          type: boolean
      - name: payments
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardQueues'
        '400':
          $ref: '#/components/responses/DashboardBadRequest'
  /dashboard/travel:
    get:
      tags:
      - Dashboard
      summary: Travel section (travelapp) and Travel Cost lines (travelapp, expense_app)
      operationId: dashboardTravel
      parameters:
      - name: today
        in: query
        schema:
          type: string
          format: date
      - name: trips
        in: query
        schema:
          type: boolean
      - name: costInvoices
        in: query
        schema:
          type: boolean
      - name: costPayments
        in: query
        schema:
          type: boolean
      - name: costCards
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardTravel'
        '400':
          $ref: '#/components/responses/DashboardBadRequest'
        '503':
          description: Card spend asked for without an expense_app pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /dashboard/engagements:
    get:
      tags:
      - Dashboard
      summary: Engagements starting in 30 days, Available Consultants, Allocations Over Time (allocation_db)
      operationId: dashboardEngagements
      parameters:
      - name: today
        in: query
        schema:
          type: string
          format: date
      - name: engagementType
        in: query
        description: Types to list; none skips the list.
        schema:
          type: array
          items:
            type: integer
      - name: bench
        in: query
        schema:
          type: boolean
      - name: trend
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEngagements'
        '400':
          $ref: '#/components/responses/DashboardBadRequest'
  /dashboard/agency:
    get:
      tags:
      - Dashboard
      summary: Travel agent dashboard of one agency (travelapp)
      operationId: dashboardAgency
      parameters:
      - name: agencyId
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      - name: today
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAgency'
        '400':
          $ref: '#/components/responses/DashboardBadRequest'
components:
  parameters:
    App:
      name: app
      in: path
      required: true
      description: The legacy app whose tables are read. Privilege ids are never comparable across apps.
      schema:
        type: string
        enum:
        - allocations
        - travel
    StartDate:
      name: startDate
      in: query
      required: true
      schema:
        type: string
        format: date
    EndDate:
      name: endDate
      in: query
      required: true
      schema:
        type: string
        format: date
    JobNumber:
      name: jobNumber
      in: path
      required: true
      schema:
        type: string
        pattern: ^TRV-\d{4}-\d{2}-\d{4}$
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PerDiemNumber:
      name: perDiemNumber
      in: path
      required: true
      schema:
        type: string
        pattern: ^TRV-\d{4}-\d{2}-\d{4}-\d{3}$
  responses:
    BadRequest:
      description: Invalid query parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 400
            message: isActive must be true or false
    NotFound:
      description: Unknown app
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 404
            message: 'unknown app "finance": must be allocations or travel'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 500
            message: internal server error
    Conflict:
      description: Duplicate or in use
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A dependency failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error:
      description: '{code, message}'
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: integer
              message:
                type: string
    TravelBadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TravelError'
    TravelNotFound:
      description: No such record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TravelError'
    DashboardBadRequest:
      description: Invalid query parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
        message:
          type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
    Role:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          example: 7
        name:
          type: string
          example: app-allocations-admin-super
    Privilege:
      type: object
      required:
      - id
      - name
      - description
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Dashboard Page
        description:
          type: string
          nullable: true
          example: View Dashboard Page
    ListRolesResponse:
      type: object
      required:
      - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    ListPrivilegesResponse:
      type: object
      required:
      - privileges
      properties:
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/Privilege'
    RolePrivilegeMapResponse:
      type: object
      required:
      - rolePrivileges
      properties:
        rolePrivileges:
          type: object
          description: Role (group) name to the privilege ids it grants, ascending. Roles with none are
            absent.
          additionalProperties:
            type: array
            items:
              type: integer
          example:
            wso2-employees:
            - 1
            app-allocations-manager-cust-eng-pre-sale:
            - 33
    EngagementType:
      type: object
      required:
      - id
      - name
      - type
      - isActive
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: Marketing Event
        type:
          type: string
          enum:
          - Internal
          - Customer
        isActive:
          type: boolean
    ListEngagementTypesResponse:
      type: object
      required:
      - engagementTypes
      properties:
        engagementTypes:
          type: array
          items:
            $ref: '#/components/schemas/EngagementType'
    AllocationType:
      type: object
      required:
      - id
      - allocationTypeName
      - status
      - engagementTypeId
      - engagementTypeName
      properties:
        id:
          type: integer
        allocationTypeName:
          type: string
          example: Pre-sale Support
        status:
          type: string
          description: As stored; Active or Deleted in any case.
          example: ACTIVE
        color:
          type: string
          nullable: true
          example: '#d030eb'
        department:
          type: string
          nullable: true
